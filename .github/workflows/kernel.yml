name: Build kernel (with artifacts)

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: keyfan/UniXNU-enchilada
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name (configs/ of the device repository)
        required: true
        default: enchilada_defconfig
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      data_seed_run_id:
        description: >-
          Run id of a "Data seed" workflow (keyfan/UniXNU-enchilada-bringup) whose data-seed-linux
          artifact is put on the payload as the writable Data volume. Leave empty for a read-only
          first boot. Its APFS volume UUID has to equal CONFIG_XNU_OWNER_DATA_VOLUME_UUID of the
          defconfig; the build checks that here instead of letting load_init_program panic.
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed so the Hello pages are skipped. Needs data_seed_run_id.
        required: false
        default: "false"

permissions:
  contents: read
  # download-artifact reads the Data seed from a run of the device repository.
  actions: read

concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.device_repository }}-${{ inputs.device_ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
      # Font.h of the boot progress console (build-boot-progress.py) lives in the Mu-Silicium checkout.
      UNIXNU_UEFI: ${{ github.workspace }}/../Mu-Silicium
      # build-native-legacy-display.py only reads the candidate from this variable (the storage builder
      # additionally falls back to the same path); it is the prelink of the kernel built above.
      ENCHILADA_STORAGE_CANDIDATE: ${{ github.workspace }}/out/enchilada/kernel/kernel.macho
    steps:
      - name: Check out UniXNU (public upstream)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG not found"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the disk the IPSW components need
        run: |
          df -h /
          df -h "$RUNNER_TEMP"

      - name: Check out Mu-Silicium for the boot progress console
        run: |
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git ../Mu-Silicium
          test -f ../Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h

      - name: Select the device
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE/device"

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch

      # A device repository that carries its own patches/xnu/ replaces UniXNU's shared series instead of
      # adding to it, and nothing fails: the build applies whatever it finds.  The board patches therefore
      # live in patches/xnu-device/ and this step writes patches/xnu/ as the union, which is what the tree
      # links and what the kernel build applies.  It has to run before the tree is assembled below.
      - name: Compose the XNU patch series
        run: |
          python3 device/scripts/compose-xnu-patches.py --write --unixnu "$GITHUB_WORKSPACE"
          python3 device/scripts/compose-xnu-patches.py --unixnu "$GITHUB_WORKSPACE"

      - name: Fetch the IPSW components the archive builders audit
        run: ./unixnu ipsw fetch KernelCache OS Cryptex1,SystemOS

      # The 21H461 userland is ad-hoc signed without a ticket, so AMFI can only resolve launchd and dyld from a
      # trust cache.  The stock device gets that from iBoot; a `fastboot boot` of our own image gets it only if
      # the payload carries the bundle, because DarwinBoot is what copies it into the kernel window and writes
      # the /chosen/memory-map/TrustCache placeholder.  Both original modules are pinned in board.toml [payload]
      # trust_cache_sha256, so the payload step accepts the result as-is.
      - name: Build the trust cache bundle the userland is signed against
        run: |
          ./unixnu ipsw fetch StaticTrustCache Cryptex1,SystemTrustCache
          python3 device/scripts/make-enchilada-trust-bundle.py --unixnu "$GITHUB_WORKSPACE"

      # The archive builders in [kernel] archives run before this step's own prelink, so their audits need a
      # reference prelink of the *original* Apple components on a tree that has never been linked.
      # build-enchilada-storage.py documents the property that makes one reusable: the slots it binds are the
      # original IOStorageFamily's at the board-independent slide, so any prelink of the pinned kernelcache
      # qualifies.  The seed below is exactly that -- an earlier prelink of 21H461, published as a release
      # asset (work/tmp/publish_seed.py) with the plan that scripts/make-seed-candidate.py rebuilt from the
      # image's own _PrelinkInfoDictionary.  Every audit still re-derives the original digests from the image,
      # so a seed that is not from this kernelcache fails rather than passing quietly.
      - name: Fetch the seed candidate the archive builders audit
        env:
          SEED: https://github.com/keyfan/unixnu-build/releases/download/seed-candidate-1
        run: |
          mkdir -p out/enchilada/kernel out/enchilada/seed
          curl -fsSL "$SEED/native-owner-ufs-rootauth3-candidate.macho.gz" -o out/enchilada/seed/candidate.macho.gz
          curl -fsSL "$SEED/native-owner-ufs-rootauth3-candidate.json" -o out/enchilada/seed/candidate.json
          gunzip -c out/enchilada/seed/candidate.macho.gz > out/enchilada/kernel/kernel.macho
          cp out/enchilada/seed/candidate.json out/enchilada/kernel/kernel.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          image = pathlib.Path('out/enchilada/kernel/kernel.macho').read_bytes()
          plan = json.loads(pathlib.Path('out/enchilada/kernel/kernel.json').read_text())
          digest = hashlib.sha256(image).hexdigest()
          if digest != plan['candidate_sha256']:
              raise SystemExit(f'seed is {digest}, but its plan describes {plan["candidate_sha256"]}')
          print(f'seed candidate {digest[:16]}: {len(plan["components"])} components, {len(plan["extents"])} extents')
          PY
          # The tree has to exist before the reference names can be staged into it.  Assembling it here also
          # surfaces a missing module now rather than halfway through the kernel build.
          ./unixnu tree
          # audit-amfi-pmgr-contract.py reads build/xnu-prelink/; the storage builder stages
          # build/native-prelink/; build-native-legacy-display.py globs native-owner-ufs-cpu-desktop-*-candidate.
          # All three want the same reference prelink, so every spelling is placed now.
          for tree in out/*/tree; do
            mkdir -p "$tree/build/xnu-prelink"
            for name in native-owner-ufs-rootauth3-candidate native-owner-ufs-cpu-desktop-enchilada-candidate; do
              for suffix in macho json; do
                cp "out/enchilada/kernel/kernel.$suffix" "$tree/build/xnu-prelink/$name.$suffix"
              done
            done
          done
          ls -l out/*/tree/build/xnu-prelink/ out/enchilada/kernel/

      - name: Build kernel
        id: kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      - name: Build DarwinBoot
        id: darwinboot
        run: |
          chmod +x device/scripts/build-darwinboot.sh
          device/scripts/build-darwinboot.sh DEBUG
          cp out/darwinboot/DarwinBoot.efi /tmp/DarwinBoot.efi

      # The writable Data volume (/private/var) comes from the packed APFS seed that the "Data seed"
      # workflow of the device repository builds: mkapfs pins the volume UUID there, so the seed always
      # matches CONFIG_XNU_OWNER_DATA_VOLUME_UUID.  Without it /private/var is the read-only OS volume and
      # tzinit exits 30 on /var/db/timezone/zoneinfo, which launchd treats as a fatal boot task.
      - name: Fetch the Data seed
        id: dataseed
        if: ${{ inputs.data_seed_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: data-seed-linux
          path: /tmp/data-seed
          run-id: ${{ inputs.data_seed_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The UUID is compiled into the kernel and a mismatch is a panic in load_init_program, not a
      # fallback, so it is checked before the payload is built.
      - name: Check the Data seed against the kernel
        if: ${{ inputs.data_seed_run_id != '' }}
        run: |
          configured=$(grep -E '^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=' device/configs/*defconfig | head -1 | cut -d'"' -f2)
          python3 - "$configured" <<'PY'
          import json, sys
          expected = sys.argv[1].upper()
          report = json.load(open('/tmp/data-seed/data-linux.json'))
          actual = str(report['volume_uuid']).upper()
          print('seed volume_uuid:', actual)
          print('kernel compiled for:', expected)
          print('seed role:', report.get('role'), 'packed_bytes:', report.get('packed_bytes'))
          if actual != expected:
              raise SystemExit(
                  f'the seed carries {actual} but the kernel was compiled for {expected}; '
                  'load_init_program would panic("offline scratch Data mount failed") before launchd')
          if report.get('role') not in (None, [], ['None'], 'none'):
              raise SystemExit(f'the seed carries role {report["role"]}; iOS panics on an unencrypted Data-role volume')
          print('the seed matches the kernel')
          PY

      - name: Build payload
        id: payload
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          args=""
          if [ -n "${{ inputs.data_seed_run_id }}" ]; then
            args="$args --data-ramdisk /tmp/data-seed/data-linux.dbr"
            if [ "${{ inputs.skip_setup }}" = "true" ]; then
              args="$args --skip-setup"
            fi
          fi
          # shellcheck disable=SC2086
          ./unixnu build payload --trust-cache "$GITHUB_WORKSPACE/out/enchilada-trust.bundle" $args
          # The bundle is what the userland is verified against; a payload that silently leaves it out looks
          # identical until init execs launchd and AMFI rejects it, so fail here instead.
          python3 - <<'PY'
          import hashlib, json, pathlib
          bundle = pathlib.Path('out/enchilada-trust.bundle')
          report = json.loads(next(pathlib.Path('out').glob('*/payload/payload.json')).read_text())
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          if report.get('trust_cache_sha256') != digest:
              raise SystemExit(f'payload.json records {report.get("trust_cache_sha256")}, the bundle is {digest}')
          print(f'trust cache {digest[:16]}: {bundle.stat().st_size} bytes, recorded in payload.json')
          PY

      - name: Inject DarwinBoot into payload.img
        if: steps.payload.outcome == 'success' && steps.darwinboot.outcome == 'success'
        run: |
          mcopy -i out/*/payload/payload.img /tmp/DarwinBoot.efi ::/EFI/UniXNU/Payloads/DarwinBoot.efi
          echo "injected DarwinBoot.efi"

      - name: Upload kernel artifacts
        if: always() && steps.kernel.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-kernel
          path: |
            out/*/kernel/kernel.macho
            out/*/kernel/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload payload artifacts
        if: always() && steps.payload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-payload
          path: |
            out/*/payload/payload.img
            out/*/payload/payload.json
            out/*/logs/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-logs
          path: out/*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
