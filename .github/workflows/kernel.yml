name: Build kernel (with artifacts)

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: keyfan/UniXNU-enchilada
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name (configs/ of the device repository)
        required: true
        default: enchilada_defconfig
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.device_repository }}-${{ inputs.device_ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
    steps:
      - name: Check out UniXNU (public upstream)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG not found"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select the device
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE/device"

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch

      - name: Build kernel
        id: kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      - name: Build DarwinBoot
        id: darwinboot
        run: |
          chmod +x device/scripts/build-darwinboot.sh
          device/scripts/build-darwinboot.sh DEBUG
          cp out/darwinboot/DarwinBoot.efi /tmp/DarwinBoot.efi

      - name: Build payload
        id: payload
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: ./unixnu build payload

      - name: Inject DarwinBoot into payload.img
        if: steps.payload.outcome == 'success' && steps.darwinboot.outcome == 'success'
        run: |
          mcopy -i out/*/payload/payload.img /tmp/DarwinBoot.efi ::/EFI/UniXNU/Payloads/DarwinBoot.efi
          echo "injected DarwinBoot.efi"

      - name: Upload kernel artifacts
        if: always() && steps.kernel.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-kernel
          path: |
            out/*/kernel/kernel.macho
            out/*/kernel/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload payload artifacts
        if: always() && steps.payload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-payload
          path: |
            out/*/payload/payload.img
            out/*/payload/payload.json
            out/*/logs/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ inputs.defconfig }}-logs
          path: out/*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
